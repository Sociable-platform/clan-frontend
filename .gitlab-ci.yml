# Publishes @clan/ui (packages/ui) to this project's GitLab package registry,
# so clan-sdk installs it by version instead of needing a checkout of this repo.
#
# Runs on develop when packages/ui changed. The version is set here, not by
# hand: major.minor come from packages/ui/package.json and the patch number is
# the pipeline number, so every run publishes a new, higher version (0.1.57,
# 0.1.63, ...). To start a new line such as 0.2.x, change major.minor in
# packages/ui/package.json.

stages:
  - publish
  - build

publish-ui:
  stage: publish
  image: node:22
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
      changes:
        - packages/ui/**/*
  variables:
    REGISTRY_HOST_PATH: ${CI_SERVER_HOST}/api/v4/projects/${CI_PROJECT_ID}/packages/npm/
  script:
    - npm ci
    - npx vitest run packages/ui
    - echo "@clan:registry=https://${REGISTRY_HOST_PATH}" >> .npmrc
    - echo "//${REGISTRY_HOST_PATH}:_authToken=${CI_JOB_TOKEN}" >> .npmrc
    - UI_BASE=$(node -p "require('./packages/ui/package.json').version.split('.').slice(0, 2).join('.')")
    - UI_VERSION="${UI_BASE}.${CI_PIPELINE_IID}"
    - |
      if npm view "@clan/ui@${UI_VERSION}" version > /dev/null 2>&1; then
        echo "@clan/ui ${UI_VERSION} is already published (this job was retried). Nothing to do."
      else
        npm pkg set version="${UI_VERSION}" --workspace @clan/ui
        npm publish --workspace @clan/ui
        echo "Published @clan/ui ${UI_VERSION}."
      fi

# Builds Studio as a container image (Dockerfile, nginx) for amd64 and arm64 (the Oracle server is ARM)
# and pushes it to this project's container registry:
#   registry.gitlab.com/clan-platform/clan-frontend/studio:<short commit sha>
# also tagged with the branch name, and latest on main. clan-backend's Helm chart deploys it.
#
# Runs on develop and main; on a merge request it can be started by hand (the ▶ button).
# VITE_PLATFORM_URL is baked into the JavaScript at build time: the public Platform URL.
images:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    PLATFORMS: linux/amd64,linux/arm64
    VITE_PLATFORM_URL: https://platform.130-61-158-79.sslip.io
  rules:
    - if: $CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
      allow_failure: true
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    # In Docker-in-Docker the connection comes from TLS environment variables, which buildx only
    # accepts through a named context; the docker-container builder can build two platforms at once.
    - docker context create tls-environment
    - docker buildx create --use --driver docker-container tls-environment
  script:
    - |
      set -eu
      tags="$CI_COMMIT_SHORT_SHA $CI_COMMIT_REF_SLUG"
      if [ "$CI_COMMIT_REF_NAME" = "main" ]; then tags="$tags latest"; fi
      image_tags=""
      for tag in $tags; do image_tags="$image_tags -t $CI_REGISTRY_IMAGE/studio:$tag"; done
      echo "== studio: $tags (VITE_PLATFORM_URL=$VITE_PLATFORM_URL)"
      docker buildx build --platform "$PLATFORMS" --build-arg "VITE_PLATFORM_URL=$VITE_PLATFORM_URL" \
        $image_tags --push .
