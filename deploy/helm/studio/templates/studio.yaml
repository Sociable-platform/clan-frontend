# Studio: one nginx pod, published at https://studio.<domain> by ingress.yaml.
apiVersion: v1
kind: Service
metadata:
  name: clan-studio
  labels:
    app.kubernetes.io/part-of: clan
    app.kubernetes.io/name: clan-studio
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  selector:
    app.kubernetes.io/name: clan-studio
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clan-studio
  labels:
    app.kubernetes.io/part-of: clan
    app.kubernetes.io/name: clan-studio
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: clan-studio
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: clan
        app.kubernetes.io/name: clan-studio
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      {{- if .Values.imagePullSecret }}
      imagePullSecrets:
        - name: {{ .Values.imagePullSecret }}
      {{- end }}
      # nginx-unprivileged runs as user 101.
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
      containers:
        - name: studio
          image: {{ printf "%s:%s" .Values.image.repository (required "image.tag is required: --set image.tag=<commit sha>" .Values.image.tag) }}
          # A commit SHA never changes, so the node can keep its copy.
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
