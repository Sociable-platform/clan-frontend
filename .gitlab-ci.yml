# Publishes @clan/ui (packages/ui) to this project's GitLab package registry,
# so clan-sdk installs it by version instead of needing a checkout of this repo.
#
# Runs on develop when packages/ui changed. The version is set here, not by
# hand: major.minor come from packages/ui/package.json and the patch number is
# the pipeline number, so every run publishes a new, higher version (0.1.57,
# 0.1.63, ...). To start a new line such as 0.2.x, change major.minor in
# packages/ui/package.json.

stages:
  - publish
  - build
  - deploy

publish-ui:
  stage: publish
  image: node:22
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
      changes:
        - packages/ui/**/*
  variables:
    REGISTRY_HOST_PATH: ${CI_SERVER_HOST}/api/v4/projects/${CI_PROJECT_ID}/packages/npm/
  script:
    - npm ci
    - npx vitest run packages/ui
    - echo "@clan:registry=https://${REGISTRY_HOST_PATH}" >> .npmrc
    - echo "//${REGISTRY_HOST_PATH}:_authToken=${CI_JOB_TOKEN}" >> .npmrc
    - UI_BASE=$(node -p "require('./packages/ui/package.json').version.split('.').slice(0, 2).join('.')")
    - UI_VERSION="${UI_BASE}.${CI_PIPELINE_IID}"
    - |
      if npm view "@clan/ui@${UI_VERSION}" version > /dev/null 2>&1; then
        echo "@clan/ui ${UI_VERSION} is already published (this job was retried). Nothing to do."
      else
        npm pkg set version="${UI_VERSION}" --workspace @clan/ui
        npm publish --workspace @clan/ui
        echo "Published @clan/ui ${UI_VERSION}."
      fi

# Builds Studio as a container image (Dockerfile, nginx) for amd64 and arm64 (the Oracle server is ARM)
# and pushes it to this project's container registry:
#   registry.gitlab.com/clan-platform/clan-frontend/studio:<short commit sha>
# also tagged with the branch name, and latest on main. The job "deploy" below deploys it from main.
#
# Runs on main; on a merge request it can be started by hand (the ▶ button).
# VITE_PLATFORM_URL is baked into the JavaScript at build time: the public Platform URL.
# VITE_DOCS_URL and VITE_SUPPORT_EMAIL are optional: set them as CI/CD variables (not protected values,
# they end up in public JavaScript) to show the footer's Docs and Contact links.
images:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    PLATFORMS: linux/amd64,linux/arm64
    VITE_PLATFORM_URL: https://platform.130-61-158-79.sslip.io
  rules:
    # main only: nothing is deployed from develop, so its images were built for nobody. A merge request can
    # still build them by hand (the play button).
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
      allow_failure: true
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    # In Docker-in-Docker the connection comes from TLS environment variables, which buildx only
    # accepts through a named context; the docker-container builder can build two platforms at once.
    - docker context create tls-environment
    - docker buildx create --use --driver docker-container tls-environment
  script:
    - |
      set -eu
      tags="$CI_COMMIT_SHORT_SHA $CI_COMMIT_REF_SLUG"
      if [ "$CI_COMMIT_REF_NAME" = "main" ]; then tags="$tags latest"; fi
      image_tags=""
      for tag in $tags; do image_tags="$image_tags -t $CI_REGISTRY_IMAGE/studio:$tag"; done
      echo "== studio: $tags (VITE_PLATFORM_URL=$VITE_PLATFORM_URL)"
      docker buildx build --platform "$PLATFORMS" --build-arg "VITE_PLATFORM_URL=$VITE_PLATFORM_URL" \
        --build-arg "VITE_DOCS_URL=${VITE_DOCS_URL:-}" --build-arg "VITE_SUPPORT_EMAIL=${VITE_SUPPORT_EMAIL:-}" \
        $image_tags --push .

# Deploys this commit's Studio image to the k3s server with deploy/deploy.sh (helm upgrade of the
# release "clan-studio" on the server, image tag = $CI_COMMIT_SHORT_SHA, the tag the "images" job
# just pushed). Only main deploys, by itself after every merge. Nothing in clan-backend has to change.
# GitLab lists every deploy under Operate -> Environments -> studio-production, where an older one
# can be deployed again (a rollback).
#
# Needs these CI/CD variables (project or group, Settings -> CI/CD -> Variables), both "Protected",
# so only pipelines of protected branches (main) can read them. They are the same two that
# clan-backend's and clan-sdk's deploy jobs use:
#   DEPLOY_SSH_KEY_B64       the CI's SSH private key, base64 in one line ("Masked")
#   DEPLOY_SSH_KNOWN_HOSTS   the server's host key (from ssh-keyscan), so CI cannot be fooled
deploy:
  stage: deploy
  image: alpine:3.20
  # Runs only after this commit's image was pushed.
  needs: [images]
  # One Studio deploy at a time; a second one waits for the first.
  resource_group: studio-production
  environment:
    name: studio-production
    url: https://studio.130-61-158-79.sslip.io
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  before_script:
    - apk add --no-cache bash openssh-client
    # Files readable only by this job's user. The values never appear in the log.
    - umask 077
    - mkdir -p ~/.ssh
    - echo "$DEPLOY_SSH_KEY_B64" | base64 -d > ~/.ssh/id_ed25519
    - echo "$DEPLOY_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
  script:
    - bash deploy/deploy.sh "$CI_COMMIT_SHORT_SHA"
  after_script:
    - rm -f ~/.ssh/id_ed25519
